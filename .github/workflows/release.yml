name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: true
        default: 'v1.2.10-boost'
      mac_run_id:
        description: 'macOS workflow run ID'
        required: true
        default: '41048661184'
      win_run_id:
        description: 'Windows workflow run ID'
        required: true
        default: '41055654815'
      release_title:
        description: 'Release title'
        required: true
        default: '64Gram v1.2.10 (Download Acceleration & Video Boost)'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mac_dl
          gh run download ${{ github.event.inputs.mac_run_id }} -n "Telegram" --dir mac_dl --repo ${{ github.repository }}
          echo "macOS artifact contents:"
          ls -la mac_dl/

      - name: Download Windows build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p win_dl
          gh run download ${{ github.event.inputs.win_run_id }} -n "Telegram x64" --dir win_dl --repo ${{ github.repository }}
          echo "Windows artifact contents:"
          ls -la win_dl/

      - name: Create Windows ZIP package
        run: |
          cd win_dl
          zip -9 -r ../Telegram-Windows-x64.zip Telegram.exe Updater.exe
          cd ..
          ls -lh Telegram-Windows-x64.zip

      - name: Create macOS DMG package
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage cmake build-essential zlib1g-dev llvm

          mkdir -p dmg_staging
          cp -a mac_dl/Telegram.app dmg_staging/
          if [ -f mac_dl/Updater ]; then
            mkdir -p dmg_staging/Telegram.app/Contents/Frameworks
            cp mac_dl/Updater dmg_staging/Telegram.app/Contents/Frameworks/Updater
            chmod +x dmg_staging/Telegram.app/Contents/Frameworks/Updater
          fi

          # Strip debug symbols and symbol tables from Mach-O binaries using llvm-strip
          llvm-strip dmg_staging/Telegram.app/Contents/MacOS/Telegram || true
          find dmg_staging/Telegram.app/Contents/Frameworks -name "*.dylib" -exec llvm-strip {} + 2>/dev/null || true
          chmod +x dmg_staging/Telegram.app/Contents/MacOS/Telegram || true
          ln -s /Applications dmg_staging/Applications

          # Create raw disk image using genisoimage
          genisoimage -V "Telegram" -D -R -apple -no-pad -o Telegram-raw.dmg dmg_staging/

          # Build libdmg-hfsplus without OpenSSL/crypto to produce compressed UDZO DMG
          git clone --depth 1 https://github.com/hamstergene/libdmg-hfsplus.git
          cd libdmg-hfsplus
          sed -i 's/VERSION [0-9.]*/VERSION 3.5/' CMakeLists.txt
          sed -i 's/find_package(OpenSSL)/# find_package(OpenSSL)/' dmg/CMakeLists.txt || true
          sed -i 's/if(OPENSSL_FOUND)/if(FALSE)/' dmg/CMakeLists.txt || true
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
          make -j$(nproc) dmg || true
          cd ..

          if [ -f libdmg-hfsplus/dmg/dmg ]; then
            echo "Compressing into native Apple UDZO DMG using libdmg..."
            ./libdmg-hfsplus/dmg/dmg dmg Telegram-raw.dmg Telegram-macOS.dmg || cp Telegram-raw.dmg Telegram-macOS.dmg
          else
            echo "Using raw disk image as DMG..."
            cp Telegram-raw.dmg Telegram-macOS.dmg
          fi

          ls -lh Telegram-macOS.dmg

      - name: Upload packaged assets as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            Telegram-macOS.dmg
            Telegram-Windows-x64.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          TITLE="${{ github.event.inputs.release_title }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" Telegram-macOS.dmg Telegram-Windows-x64.zip --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              Telegram-macOS.dmg \
              Telegram-Windows-x64.zip \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --target ${{ github.ref_name }}
          fi
