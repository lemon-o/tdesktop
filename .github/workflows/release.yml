name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: true
        default: 'v1.2.10-boost'
      mac_run_id:
        description: 'macOS workflow run ID'
        required: true
        default: '41048661184'
      win_run_id:
        description: 'Windows workflow run ID'
        required: true
        default: '41055654815'
      release_title:
        description: 'Release title'
        required: true
        default: '64Gram v1.2.10 (Download Acceleration & Video Boost)'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging and compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage cmake build-essential zlib1g-dev libssl-dev llvm p7zip-full

      - name: Download macOS build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mac_dl
          gh run download ${{ github.event.inputs.mac_run_id }} -n "Telegram" --dir mac_dl --repo ${{ github.repository }}
          echo "macOS artifact contents:"
          ls -la mac_dl/

      - name: Download Windows build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p win_dl
          gh run download ${{ github.event.inputs.win_run_id }} -n "Telegram x64" --dir win_dl --repo ${{ github.repository }}
          echo "Windows artifact contents:"
          ls -la win_dl/

      - name: Process and package Windows x64 release
        run: |
          echo "Original Windows binary sizes:"
          ls -lh win_dl/

          # 1. Strip debug info using llvm-strip
          echo "Stripping Windows binaries with llvm-strip..."
          llvm-strip --strip-all win_dl/Telegram.exe || llvm-strip --strip-debug win_dl/Telegram.exe || true
          llvm-strip --strip-all win_dl/Updater.exe || llvm-strip --strip-debug win_dl/Updater.exe || true

          echo "Sizes after llvm-strip:"
          ls -lh win_dl/

          # 2. Create high-compression ZIP package using 7-Zip (maximum Deflate settings)
          echo "Creating Telegram-Windows-x64.zip..."
          cd win_dl
          7z a -tzip -mx=9 -mfb=258 -mpass=15 ../Telegram-Windows-x64.zip Telegram.exe Updater.exe
          cd ..
          ls -lh Telegram-Windows-x64.zip

      - name: Process and package macOS DMG release
        run: |
          mkdir -p dmg_staging
          cp -a mac_dl/Telegram.app dmg_staging/
          if [ -f mac_dl/Updater ]; then
            mkdir -p dmg_staging/Telegram.app/Contents/Frameworks
            cp mac_dl/Updater dmg_staging/Telegram.app/Contents/Frameworks/Updater
            chmod +x dmg_staging/Telegram.app/Contents/Frameworks/Updater
          fi
          chmod +x dmg_staging/Telegram.app/Contents/MacOS/Telegram || true
          ln -s /Applications dmg_staging/Applications

          # 1. Strip macOS Mach-O debug symbols
          echo "Original macOS binary size:"
          ls -lh dmg_staging/Telegram.app/Contents/MacOS/Telegram

          echo "Stripping macOS binaries with llvm-strip..."
          llvm-strip -x dmg_staging/Telegram.app/Contents/MacOS/Telegram || llvm-strip --strip-debug dmg_staging/Telegram.app/Contents/MacOS/Telegram || true
          if [ -f dmg_staging/Telegram.app/Contents/Frameworks/Updater ]; then
            llvm-strip -x dmg_staging/Telegram.app/Contents/Frameworks/Updater || llvm-strip --strip-debug dmg_staging/Telegram.app/Contents/Frameworks/Updater || true
          fi
          find dmg_staging/Telegram.app/Contents/Frameworks -name "*.dylib" -exec llvm-strip --strip-debug {} + 2>/dev/null || true

          echo "Stripped macOS binary size:"
          ls -lh dmg_staging/Telegram.app/Contents/MacOS/Telegram

          # 2. Build libdmg-hfsplus (openssl-1.1 branch with modern OpenSSL support)
          git clone -b openssl-1.1 --depth 1 https://github.com/planetbeing/libdmg-hfsplus.git
          cd libdmg-hfsplus
          sed -i 's/VERSION [0-9.]*/VERSION 3.5/' CMakeLists.txt
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
          make -j$(nproc)
          cd ..

          # 3. Create raw Apple HFS disk image
          genisoimage -V "Telegram" -D -R -apple -no-pad -o Telegram-raw.dmg dmg_staging/

          DMG_BIN=$(find libdmg-hfsplus -type f -name "dmg" -perm /111 | head -n 1)
          if [ -n "$DMG_BIN" ] && [ -x "$DMG_BIN" ]; then
            echo "Found libdmg compressor: $DMG_BIN"
            echo "Compressing raw image into native Apple UDZO DMG..."
            $DMG_BIN dmg Telegram-raw.dmg Telegram-macOS.dmg
            rm -f Telegram-raw.dmg
          else
            echo "libdmg binary not found, keeping raw image..."
            mv Telegram-raw.dmg Telegram-macOS.dmg
          fi

          ls -lh Telegram-macOS.dmg

      - name: Upload packaged assets as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            Telegram-macOS.dmg
            Telegram-Windows-x64.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          TITLE="${{ github.event.inputs.release_title }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" Telegram-macOS.dmg Telegram-Windows-x64.zip --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              Telegram-macOS.dmg \
              Telegram-Windows-x64.zip \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --target ${{ github.ref_name }}
          fi
